name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall -q src
      - name: Offline unit tests
        run: pytest -q
      - name: Package import check
        run: python -c "import conflux_analytics; import conflux_analytics.api.app; import conflux_analytics.cli"
