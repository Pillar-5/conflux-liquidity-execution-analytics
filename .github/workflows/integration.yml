name: Integration tests (live Conflux eSpace)

on:
  workflow_dispatch: {}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live tests against public RPC
        env:
          CONFLUX_RPC_URL: https://evm.confluxrpc.com
          CONFLUX_CHAIN_ID: "1030"
        run: pytest -q -m integration
